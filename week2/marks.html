<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Subject Marks Calculator</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 420px;
    margin: 40px auto;
    padding: 20px;
  }
  h2 {
    text-align: center;
  }
  label {
    display: inline-block;
    width: 90px;
  }
  input {
    width: 80px;
    padding: 4px;
    margin-bottom: 10px;
  }
  button {
    display: block;
    margin: 15px auto;
    padding: 8px 20px;
    font-size: 16px;
    cursor: pointer;
  }
  #result {
    text-align: center;
    font-size: 18px;
  }
</style>
</head>
<body>

<h2>Subject Marks Calculator</h2>
<p style="text-align:center;">Enter marks (out of 100) for 8 subjects</p>

<div>
  <label for="sub1">Subject 1:</label>
  <input type="number" id="sub1" min="0" max="100"><br>

  <label for="sub2">Subject 2:</label>
  <input type="number" id="sub2" min="0" max="100"><br>

  <label for="sub3">Subject 3:</label>
  <input type="number" id="sub3" min="0" max="100"><br>

  <label for="sub4">Subject 4:</label>
  <input type="number" id="sub4" min="0" max="100"><br>

  <label for="sub5">Subject 5:</label>
  <input type="number" id="sub5" min="0" max="100"><br>

  <label for="sub6">Subject 6:</label>
  <input type="number" id="sub6" min="0" max="100"><br>

  <label for="sub7">Subject 7:</label>
  <input type="number" id="sub7" min="0" max="100"><br>

  <label for="sub8">Subject 8:</label>
  <input type="number" id="sub8" min="0" max="100"><br>
</div>

<button onclick="calculateResult()">Calculate</button>

<h3 id="result"></h3>

<script src="task2.js"></script>
</body>
</html>
