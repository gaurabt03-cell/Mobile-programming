<!DOCTYPE html>

<html>
<head>
    <title>jQuery Moving Square</title>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<style>
    body {
        font-family: Arial, sans-serif;
        padding: 25px;
        background: #f4f6f8;
    }

    #runBtn {
        padding: 10px 18px;
        margin-bottom: 20px;
        border: none;
        border-radius: 6px;
        background: #333;
        color: white;
        cursor: pointer;
    }

    #area {
        width: 450px;
        height: 300px;
        border: 2px solid #555;
        position: relative;
        background: white;
    }

    #square {
        width: 50px;
        height: 50px;
        background: #e91e63;
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 8px;
    }
</style>


</head>

<body>


<button id="runBtn">Run Animation</button>

<div id="area">
    <div id="square"></div>
</div>

<script>
    $(function () {

        $("#runBtn").on("click", function () {

            var square = $("#square");

            square
                .animate({ left: "400px" }, 800, function () {
                    $(this).css("background-color", "#2196F3");
                })
                .animate({ top: "250px" }, 800, function () {
                    $(this).css("background-color", "#4CAF50");
                })
                .animate({ left: "0px" }, 800, function () {
                    $(this).css("background-color", "#FF9800");
                })
                .animate({ top: "0px" }, 800, function () {
                    $(this).css("background-color", "#9C27B0");
                });

        });

    });
</script>


</body>
</html>
