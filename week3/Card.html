```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gaurab Thapa - Profile</title>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 45px 15px;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            text-align: center;
        }

        .page-title {
            color: #1e293b;
            margin-bottom: 25px;
        }

        .profile-card {
            width: 320px;
            margin: 0 auto;
            padding: 25px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            transition: 0.3s;
        }

        .profile-picture {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #2563eb;
        }

        .profile-name {
            margin: 15px 0 8px;
            color: #111827;
        }

        .profile-info {
            color: #4b5563;
            line-height: 1.7;
        }

        .btn {
            padding: 11px 23px;
            border: none;
            border-radius: 8px;
            color: white;
            background: #2563eb;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        #linkedinArea {
            display: none;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #d1d5db;
        }

        .qr-code {
            width: 140px;
            height: 140px;
            margin: 8px;
        }

        #closeQR {
            background: #64748b;
        }

        #closeQR:hover {
            background: #475569;
        }
    </style>
</head>

<body>

    <h1 class="page-title">My Student Profile</h1>

    <div class="profile-card" id="myProfile">

        <!-- Profile Photo -->
        <img
            class="profile-picture"
            src="week3/profile.jpg"
            alt="Gaurab Thapa"
        >

        <h2 class="profile-name">Gaurab Thapa</h2>

        <p class="profile-info">
            <strong>Location:</strong> Kathmandu, Nepal<br>
            <strong>Study:</strong> Information Technology
        </p>

        <!-- Open QR -->
        <button class="btn" id="openLinkedIn">
            View LinkedIn
        </button>

        <!-- LinkedIn QR Area -->
        <div id="linkedinArea">

            <p>Scan this QR code to visit my LinkedIn.</p>

            <img
                class="qr-code"
                src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https%3A%2F%2Fwww.linkedin.com%2Fin%2Fgaurab-thapa-316153358"
                alt="Gaurab Thapa LinkedIn QR Code"
            >

            <br>

            <!-- Close QR -->
            <button class="btn" id="closeQR">
                Hide QR
            </button>

        </div>

    </div>

    <script>

        $(document).ready(function () {

            // Display LinkedIn QR code
            $("#openLinkedIn").on("click", function () {

                $("#linkedinArea").fadeIn(400);

                $("#myProfile").css(
                    "box-shadow",
                    "0 12px 30px rgba(37, 99, 235, 0.30)"
                );
            });


            // Hide LinkedIn QR code
            $("#closeQR").on("click", function () {

                $("#linkedinArea").fadeOut(300);

                $("#myProfile").css(
                    "box-shadow",
                    "0 8px 25px rgba(0, 0, 0, 0.15)"
                );
            });

        });

    </script>

</body>

</html>
```
